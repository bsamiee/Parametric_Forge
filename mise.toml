# --- [SETTINGS] -------------------------------------------------------------------------
[settings]
python.uv_venv_auto = "create|source"

# --- [ENV] ------------------------------------------------------------------------------
[env]
DOPPLER_CONFIG             = "dev_machine"
DOPPLER_PROJECT            = "parametric-forge"
FASTMCP_SHOW_SERVER_BANNER = "false"

# --- [TOOLS] ----------------------------------------------------------------------------
[tools]
python = "3.15.0"
node = "latest"
pnpm = "latest"
uv = "latest"
doppler = "latest"
pulumi = "latest"
ripgrep = "latest"
fd = "latest"
"pypi:mcp-nixos" = "latest"
