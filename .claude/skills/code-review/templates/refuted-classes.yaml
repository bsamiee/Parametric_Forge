        - '(verify|re-?check).{0,50}(issuer|signature|acceptance).{0,50}inside'
        - 'ThrowIfNull'
        - 'null \w+s? (is|are) (rejected|checked|guarded)'
      refuting_citation: 'templates/fix.md trichotomy — generated-enum instances and value-struct payloads are valid by construction; interior re-validation of admitted values is pushed back'
      landed_surfaces:
        - '.coderabbit.yaml'
        - '.greptile/rules.md'
        - '.macroscope/correctness/csharp/api-truths.md'
      recurrences: 3
