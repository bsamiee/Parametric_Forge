cacheDir: .cache/pnpm/cache

stateDir: .cache/pnpm/state

storeDir: .cache/pnpm/store

allowBuilds:
    "@parcel/watcher": false
    msgpackr-extract: false
    protobufjs: false

catalog:
    # substrate — the Effect core family; moves as one peer-locked wave
    effect: 3.21.4
    "@effect/platform": 0.97.2
    "@effect/platform-node": 0.108.2
    # services — the Pulumi engine and provider set; pins follow package schema
    "@pulumi/pulumi": 3.262.0
    "@pulumi/github": 6.15.0
    "@pulumiverse/doppler": 0.9.0
    # toolchain — TypeScript 7 (the native compiler) is the one gate; the Nix roster carries the same major for the editor
    typescript: 7.0.2
    "@types/node": 26.1.1
    "@effect/language-service": 0.87.2

minimumReleaseAgeExclude:
    - "@effect/language-service@0.87.2"
