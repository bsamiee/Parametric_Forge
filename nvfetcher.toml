[design-nodejs_26]
src.cmd = "curl -fsSL https://nodejs.org/dist/index.json | jq -r 'map(.version | select(startswith(\"v26.\"))) | first | ltrimstr(\"v\")'"
fetch.url = "https://nodejs.org/dist/v$ver/node-v$ver.tar.xz"

[sqlean-aarch64-darwin]
