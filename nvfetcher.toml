# Pin-source declarations for every pinned overlays/manifest.nix row. One pass from the locked nixpkgs advances the complete family, the
# keyfile carrying the gh token nvchecker reads for every GitHub source (zsh `=()` hands it a temp file, since nvchecker reopens the keyfile
# per source and a `<()` pipe reads once):
# `nix shell .#nvfetcher -c nvfetcher -o overlays/_sources -k =(printf '[keys]\ngithub = "%s"\n' "$(gh auth token)")`.

[nvfetcher]
src.webpage = "https://hackage.haskell.org/package/nvfetcher/preferred.json"
src.regex = '"([0-9]+(?:\.[0-9]+)+)"'
fetch.url = "https://hackage.haskell.org/package/nvfetcher-$ver/nvfetcher-$ver.tar.gz"

[rclone]
src.github = "rclone/rclone"
src.prerelease = true
src.prefix = "v"
fetch.tarball = "https://github.com/rclone/rclone/archive/refs/tags/v$ver.tar.gz"

[ocrmypdf]
src.pypi = "ocrmypdf"
fetch.tarball = "https://github.com/ocrmypdf/OCRmyPDF/archive/refs/tags/v$ver.tar.gz"

[ocr-pikepdf]
src.pypi = "pikepdf"
fetch.tarball = "https://github.com/pikepdf/pikepdf/archive/refs/tags/v$ver.tar.gz"

[ocr-pydantic]
src.pypi = "pydantic"
fetch.tarball = "https://github.com/pydantic/pydantic/archive/refs/tags/v$ver.tar.gz"

[ocr-pydantic-core]
src.pypi = "pydantic-core"
fetch.tarball = "https://github.com/pydantic/pydantic/archive/refs/tags/core-v$ver.tar.gz"
cargo_lock = ["pydantic-core/Cargo.lock"]

[ocr-pypdfium2]
src.pypi = "pypdfium2"
fetch.tarball = "https://github.com/pypdfium2-team/pypdfium2/archive/refs/tags/$ver.tar.gz"
extract = ["autorelease/record.json"]

# Design renderers and native application routing; update with --filter '^design-'.
[design-harfbuzz]
src.github = "harfbuzz/harfbuzz"
src.prerelease = true
fetch.url = "https://github.com/harfbuzz/harfbuzz/releases/download/$ver/harfbuzz-$ver.tar.xz"

[design-mupdf]
src.github_tag = "ArtifexSoftware/mupdf"
src.include_regex = "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[A-Za-z0-9.]+)?$"
fetch.url = "https://mupdf.com/downloads/archive/mupdf-$ver-source.tar.gz"

[design-utiluti]
src.github = "scriptingosx/utiluti"
src.prerelease = true
src.prefix = "v"
fetch.url = "https://github.com/scriptingosx/utiluti/releases/download/v$ver/utiluti-$ver.pkg"

[design-verapdf-cli]
src.webpage = "https://artifactory.openpreservation.org/artifactory/vera-dev/org/verapdf/apps/cli/maven-metadata.xml"
src.regex = "<latest>([0-9]+\\.[0-9]+\\.[0-9]+)</latest>"
fetch.url = "https://artifactory.openpreservation.org/artifactory/vera-dev/org/verapdf/apps/cli/$ver/cli-$ver.jar"

# fonttools pins its PyPI sdist, which carries the version its build backend reads without a git checkout.
[design-fonttools]
src.pypi = "fonttools"
fetch.pypi = "fonttools"

# GNOME's download index supplies librsvg releases. Cargo.lock supplies crate versions and hashes.
[design-librsvg]
src.cmd = '''curl -fsSL https://download.gnome.org/sources/librsvg/cache.json | jq -r '.[1].librsvg | keys | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | max_by(split(".") | map(tonumber))' '''
fetch.tarball = "https://gitlab.gnome.org/GNOME/librsvg/-/archive/$ver/librsvg-$ver.tar.gz"
cargo_lock = ["Cargo.lock"]

# Prebuilt trees pin as tarballs: the hash covers the unpacked tree, so the overlay links it in place and a nixpkgs move never re-copies it.
# The font archives land unpacked the way nixpkgs' own recipes fetch them.
[design-geist-font]
src.github = "vercel/geist-font"
src.prerelease = true
src.prefix = "v"
fetch.tarball = "https://github.com/vercel/geist-font/releases/download/v$ver/geist-font-v$ver.zip"

[design-scheherazade-new]
src.github = "silnrsi/font-scheherazade"
src.prerelease = true
src.prefix = "v"
fetch.tarball = "https://github.com/silnrsi/font-scheherazade/releases/download/v$ver/ScheherazadeNew-$ver.zip"

[design-pandoc-aarch64-darwin]
src.github = "jgm/pandoc"
src.prerelease = true
fetch.tarball = "https://github.com/jgm/pandoc/releases/download/$ver/pandoc-$ver-arm64-macOS.zip"

[biome-aarch64-darwin]
src.github = "biomejs/biome"
src.prerelease = true
src.prefix = "@biomejs/biome@"
fetch.url = "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40$ver/biome-darwin-arm64"

# mise release tarballs carry the binary and its man page.
[mise-aarch64-darwin]
src.github = "jdx/mise"
src.prerelease = true
src.prefix = "v"
fetch.url = "https://github.com/jdx/mise/releases/download/v$ver/mise-v$ver-macos-arm64.tar.gz"

# watchexec release tarballs carry the binary, its man page, and shell completions under one directory.
[watchexec-aarch64-darwin]
src.github = "watchexec/watchexec"
src.prerelease = true
src.prefix = "v"
fetch.tarball = "https://github.com/watchexec/watchexec/releases/download/v$ver/watchexec-$ver-aarch64-apple-darwin.tar.xz"

[zellij-aarch64-darwin]
src.github = "zellij-org/zellij"
src.prerelease = true
src.prefix = "v"
fetch.url = "https://github.com/zellij-org/zellij/releases/download/v$ver/zellij-aarch64-apple-darwin.tar.gz"

# duckdb: nixpkgs trails the upstream major. The release tarball holds the one CLI executable and no top directory, so the pin stays the archive.
[duckdb-aarch64-darwin]
src.github = "duckdb/duckdb"
src.prerelease = true
src.prefix = "v"
fetch.url = "https://github.com/duckdb/duckdb/releases/download/v$ver/duckdb-cli-osx-arm64.tar.gz"

# 1Password's release history supplies stable and beta universal macOS packages.
[1password-cli-aarch64-darwin]
src.webpage = "https://app-updates.agilebits.com/product_history/CLI2"
src.regex = "op_apple_universal_v([0-9]+\\.[0-9]+\\.[0-9]+(?:-[A-Za-z0-9.]+)?)\\.pkg"
fetch.url = "https://cache.agilebits.com/dist/1P/op2/pkg/v$ver/op_apple_universal_v$ver.pkg"

# vl-convert: Vega and Vega-Lite to SVG/PNG/JPEG/PDF with V8 linked into one executable; nixpkgs carries only the python binding, never the CLI.
# Release selection requires the standalone CLI asset. The asset is a zip, pinned unpacked.
[vl-convert-aarch64-darwin]
src.cmd = "gh api repos/vega/vl-convert/releases --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == \"vl-convert_osx-arm64.zip\"))][0].tag_name'"
src.prefix = "v"
fetch.tarball = "https://github.com/vega/vl-convert/releases/download/v$ver/vl-convert_osx-arm64.zip"

# The release zip is a flat list of extension libraries with no top directory, pinned unpacked; the manifest row keeps the root unstripped.
[sqlean-aarch64-darwin]
src.github = "nalgeon/sqlean"
src.prerelease = true
fetch.tarball = "https://github.com/nalgeon/sqlean/releases/download/$ver/sqlean-macos-arm64.zip"

# EnergyPlus and OpenStudio asset names carry a build hash and, for EnergyPlus, the macOS floor, so each pin resolves the latest release's
# arm64 tarball through the authenticated releases API and carries `<tag>/<asset>` as its release tag (manifest.nix extracts the bare version).
[energyplus-aarch64-darwin]
src.cmd = "gh api repos/NatLabRockies/EnergyPlus/releases --jq '[.[] | select(.draft | not) | . as $r | .assets[].name | select(contains(\"-Darwin-\") and endswith(\"-arm64.tar.gz\")) | $r.tag_name + \"/\" + .][0]'"
fetch.tarball = "https://github.com/NatLabRockies/EnergyPlus/releases/download/$ver"

[openstudio-aarch64-darwin]
src.cmd = "gh api repos/NatLabRockies/OpenStudio/releases --jq '[.[] | select(.draft | not) | . as $r | .assets[].name | select(endswith(\"-Darwin-arm64.tar.gz\")) | $r.tag_name + \"/\" + @uri][0]'"
fetch.tarball = "https://github.com/NatLabRockies/OpenStudio/releases/download/$ver"
