fetch.tarball = "https://api.adoptium.net/v3/binary/version/$ver/mac/aarch64/jre/hotspot/normal/eclipse"

[design-temurin-x86_64-linux]
src.github = "adoptium/temurin26-binaries"
fetch.tarball = "https://api.adoptium.net/v3/binary/version/$ver/linux/x64/jre/hotspot/normal/eclipse"

[design-temurin-aarch64-linux]
