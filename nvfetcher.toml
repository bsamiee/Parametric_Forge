# Pin-source declarations for every pinned overlays/manifest.nix row; nvfetcher lives in the flake devShell alone, so
# `nix develop -c nvfetcher -o overlays/_sources` advances the complete family.

# Design renderers and native application routing; update with --filter '^design-'.
[design-imagemagick]
src.github = "ImageMagick/ImageMagick"
fetch.url = "https://github.com/ImageMagick/ImageMagick/releases/download/$ver/ImageMagick-$ver.tar.xz"

[design-harfbuzz]
src.github = "harfbuzz/harfbuzz"
fetch.url = "https://github.com/harfbuzz/harfbuzz/releases/download/$ver/harfbuzz-$ver.tar.xz"

[design-poppler]
src.webpage = "https://poppler.freedesktop.org/"
src.regex = "poppler-([0-9]+\\.[0-9]+\\.[0-9]+)\\.tar\\.xz"
fetch.url = "https://poppler.freedesktop.org/poppler-$ver.tar.xz"

[design-poppler-test-data]
src.git = "https://gitlab.freedesktop.org/poppler/test.git"
fetch.git = "https://gitlab.freedesktop.org/poppler/test.git"

[design-mupdf]
src.github_tag = "ArtifexSoftware/mupdf"
src.include_regex = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
fetch.url = "https://mupdf.com/downloads/archive/mupdf-$ver-source.tar.gz"

[design-qpdf]
src.github = "qpdf/qpdf"
src.prefix = "v"
fetch.url = "https://github.com/qpdf/qpdf/releases/download/v$ver/qpdf-$ver.tar.gz"

[design-ghostscript]
src.cmd = "curl -fsSL https://api.github.com/repos/ArtifexSoftware/ghostpdl-downloads/releases/latest | jq -r '. as $r | .assets[].name | select(startswith(\"ghostscript-\") and endswith(\".tar.xz\")) | $r.tag_name + \"/\" + .'"
fetch.url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/$ver"

[design-geist-font]
src.github = "vercel/geist-font"
src.prefix = "v"
fetch.url = "https://github.com/vercel/geist-font/releases/download/v$ver/geist-font-v$ver.zip"

[design-scheherazade-new]
src.github = "silnrsi/font-scheherazade"
src.prefix = "v"
fetch.url = "https://github.com/silnrsi/font-scheherazade/releases/download/v$ver/ScheherazadeNew-$ver.zip"

[design-utiluti]
src.github = "scriptingosx/utiluti"
src.prefix = "v"
fetch.url = "https://github.com/scriptingosx/utiluti/releases/download/v$ver/utiluti-$ver.pkg"

[design-verapdf-cli]
src.webpage = "https://artifactory.openpreservation.org/artifactory/vera-dev/org/verapdf/apps/cli/maven-metadata.xml"
src.regex = "<latest>([0-9]+\\.[0-9]+\\.[0-9]+)</latest>"
fetch.url = "https://artifactory.openpreservation.org/artifactory/vera-dev/org/verapdf/apps/cli/$ver/cli-$ver.jar"

# Prebuilt trees pin as tarballs: the hash covers the unpacked tree, so the overlay links it in place and a nixpkgs move never re-copies it.
[design-pandoc-aarch64-darwin]
src.github = "jgm/pandoc"
fetch.tarball = "https://github.com/jgm/pandoc/releases/download/$ver/pandoc-$ver-arm64-macOS.zip"

[design-temurin-aarch64-darwin]
src.github = "adoptium/temurin26-binaries"
fetch.tarball = "https://api.adoptium.net/v3/binary/version/$ver/mac/aarch64/jre/hotspot/normal/eclipse"

[biome-aarch64-darwin]
src.github = "biomejs/biome"
src.prefix = "@biomejs/biome@"
fetch.url = "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40$ver/biome-darwin-arm64"

# mise release tarballs carry the binary and its man page.
[mise-aarch64-darwin]
src.github = "jdx/mise"
src.prefix = "v"
fetch.url = "https://github.com/jdx/mise/releases/download/v$ver/mise-v$ver-macos-arm64.tar.gz"

# 1Password publishes the CLI on its release-history page; the version group matches only stable `x.y.z` asset names, so betas stay out.
# macOS ships one universal flat package.
[1password-cli-aarch64-darwin]
src.webpage = "https://app-updates.agilebits.com/product_history/CLI2"
src.regex = "op_apple_universal_v([0-9]+\\.[0-9]+\\.[0-9]+)\\.pkg"
fetch.url = "https://cache.agilebits.com/dist/1P/op2/pkg/v$ver/op_apple_universal_v$ver.pkg"

# vl-convert: Vega and Vega-Lite to SVG/PNG/JPEG/PDF with V8 linked into one executable; nixpkgs carries only the python binding, never the CLI.
# `src.github` tracks the latest non-prerelease, so the 2.0.0-rc line stays out until it ships stable. The asset is a zip, pinned unpacked.
[vl-convert-aarch64-darwin]
src.github = "vega/vl-convert"
src.prefix = "v"
fetch.tarball = "https://github.com/vega/vl-convert/releases/download/v$ver/vl-convert_osx-arm64.zip"

# The release zip is a flat list of extension libraries with no top directory, so it stays a file the recipe unpacks itself.
[sqlean-aarch64-darwin]
src.github = "nalgeon/sqlean"
fetch.url = "https://github.com/nalgeon/sqlean/releases/download/$ver/sqlean-macos-arm64.zip"

# EnergyPlus and OpenStudio asset names carry a build hash and, for EnergyPlus, the macOS floor, so each pin resolves the latest release's
# arm64 tarball through the releases API and carries `<tag>/<asset>` as its release tag (manifest.nix extracts the bare version).
[energyplus-aarch64-darwin]
src.cmd = "curl -fsSL https://api.github.com/repos/NatLabRockies/EnergyPlus/releases/latest | jq -r '. as $r | .assets[].name | select(contains(\"-Darwin-\") and endswith(\"-arm64.tar.gz\")) | $r.tag_name + \"/\" + .'"
fetch.tarball = "https://github.com/NatLabRockies/EnergyPlus/releases/download/$ver"

[openstudio-aarch64-darwin]
src.cmd = "curl -fsSL https://api.github.com/repos/NatLabRockies/OpenStudio/releases/latest | jq -r '. as $r | .assets[].name | select(endswith(\"-Darwin-arm64.tar.gz\")) | $r.tag_name + \"/\" + @uri'"
fetch.tarball = "https://github.com/NatLabRockies/OpenStudio/releases/download/$ver"

# Zellij status bar wasm; one release asset, fetched flat.
[zjstatus]
src.github = "dj95/zjstatus"
src.prefix = "v"
fetch.url = "https://github.com/dj95/zjstatus/releases/download/v$ver/zjstatus.wasm"
