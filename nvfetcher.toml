src.github = "biomejs/biome"
src.prefix = "@biomejs/biome@"
fetch.url = "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40$ver/biome-linux-x64-musl"

# mise release tarballs carry the binary and its man page; Linux rows pin the musl static builds like biome, so no patchelf lane is needed.
[mise-aarch64-darwin]
